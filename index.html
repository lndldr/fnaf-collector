<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>FNAF Collector</title>
<style>
:root{--bg:#080a0f;--panel:#11151d;--panel2:#171c25;--line:#272d38;--text:#f3f5f7;--muted:#8e97a6;--red:#d71920;--gold:#f3c74f;--green:#42d17b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#202632 0,#0b0e14 38%,#07090d 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:18px 14px 50px}
header{padding:12px 2px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font-size:30px;letter-spacing:.5px}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.badge{border:1px solid #333b48;background:#11151d;border-radius:999px;padding:7px 10px;font-size:12px;color:#cdd3dc}
.progress{height:9px;background:#202630;border-radius:99px;overflow:hidden;margin:4px 0 16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#9f1016,var(--red),#ff555b);transition:.25s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.num{font-size:20px;font-weight:800}.lab{font-size:11px;color:var(--muted);margin-top:2px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:14px}
.search{width:100%;background:#090c11;border:1px solid #303744;color:white;border-radius:11px;padding:12px 13px;outline:none}.search:focus{border-color:#596579}
.tabs{display:flex;gap:7px;overflow:auto;padding-top:9px}.tab,.filter,.sort{white-space:nowrap;border:1px solid #303744;background:#0c1016;color:#c8ced8;border-radius:10px;padding:8px 10px;font-size:12px}.tab.active,.filter.active{background:#b51219;border-color:#d9333a;color:white}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
select{background:#0c1016;color:#dce1e8;border:1px solid #303744;border-radius:10px;padding:8px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.card{position:relative;background:linear-gradient(180deg,#151a23,#10141b);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 7px 20px #0005}
.card.owned{border-color:#2f704c}.pic{height:210px;background:#e9e9e9;display:flex;align-items:center;justify-content:center;position:relative}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.fallback{display:none;color:#303030;text-align:center;font-weight:900;font-size:15px;padding:20px}.pic.bad .fallback{display:block}.pic.bad img{display:none}
.mark{position:absolute;top:8px;left:8px;background:#111d;color:white;border:1px solid #ffffff22;border-radius:8px;padding:5px 7px;font-size:10px}
.heart{position:absolute;right:8px;top:8px;border:0;background:#111d;color:white;border-radius:50%;width:32px;height:32px}.heart.on{color:#ff6b72}
.body{padding:10px}.name{font-weight:800;font-size:14px;line-height:1.2;min-height:34px}.meta{font-size:11px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:6px;margin-top:9px}.own{flex:1;border:1px solid #3a424f;background:#1a202a;color:#dce2ea;border-radius:9px;padding:8px;font-size:11px}.own.on{background:#1f6743;border-color:#43b976;color:white}.info{border:1px solid #3a424f;background:#0b0f15;color:#cbd2dc;border-radius:9px;padding:8px 10px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:90vh;overflow:auto;background:#10141b;border:1px solid #303744;border-radius:20px 20px 0 0;padding:16px}.close{float:right;border:0;background:#242a34;color:white;border-radius:50%;width:34px;height:34px}.detail{display:grid;grid-template-columns:180px 1fr;gap:15px;margin-top:8px}.detail img{width:180px;height:230px;object-fit:contain;background:#eee;border-radius:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.field input,.field textarea{width:100%;background:#090c11;border:1px solid #303744;color:white;border-radius:9px;padding:9px}.field textarea{min-height:70px;resize:vertical}.wide{grid-column:1/-1}.save{margin-top:12px;width:100%;border:0;background:#c5161d;color:white;border-radius:10px;padding:11px;font-weight:800}.link{display:inline-block;margin-top:10px;color:#8fb7ff;font-size:12px}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}.pic{height:200px}}
@media(max-width:600px){.wrap{padding:14px 10px 40px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:190px}.detail{grid-template-columns:120px 1fr}.detail img{width:120px;height:160px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}}
@media(max-width:390px){.pic{height:165px}.name{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>FNAF COLLECTOR</h1><div class="sub">Jazwares • checklist personnelle</div></div><div class="badge" id="countBadge">0 / 43</div></header>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="stats"><div class="stat"><div class="num" id="ownedN">0</div><div class="lab">POSSEDÉES</div></div><div class="stat"><div class="num" id="missingN">43</div><div class="lab">MANQUANTES</div></div><div class="stat"><div class="num" id="wishN">0</div><div class="lab">WISHLIST</div></div></div>
<div class="toolbar">
<input id="search" class="search" placeholder="🔎 Rechercher une figurine…">
<div class="tabs"><button class="tab active" data-cat="all">Toutes</button><button class="tab" data-cat="World of FNAF">World of FNAF</button><button class="tab" data-cat="Endo-Series">Endo-Series</button></div>
<div class="controls">
<button class="filter active" data-filter="all">Tout</button><button class="filter" data-filter="missing">Manquantes</button><button class="filter" data-filter="owned">Possédées</button><button class="filter" data-filter="wishlist">Wishlist</button>
<select id="sort"><option value="id">Ordre collection</option><option value="az">A → Z</option><option value="za">Z → A</option></select>
<button class="sort" id="export">Export</button><button class="sort" id="importBtn">Import</button><button class="sort" id="reset">Reset</button>
</div></div>
<div id="grid" class="grid"></div><div id="empty" class="empty" style="display:none">Aucune figurine ne correspond.</div>
</div>
<input type="file" id="file" accept=".json" style="display:none">
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><h2 id="mTitle"></h2><div class="detail"><div><img id="mImg"><a class="link" id="mLink" target="_blank" rel="noopener">Voir sur FigureRealm ↗</a></div><div class="fields">
<div class="field"><label>PRIX PAYÉ (€)</label><input id="price" type="number" step="0.01"></div>
<div class="field"><label>VALEUR ESTIMÉE (€)</label><input id="value" type="number" step="0.01"></div>
<div class="field"><label>QUANTITÉ</label><input id="qty" type="number" min="1"></div>
<div class="field"><label>ÉTAT</label><input id="condition" placeholder="Neuf, loose, etc."></div>
<div class="field wide"><label>NOTES</label><textarea id="notes"></textarea></div>
</div></div><button class="save" id="save">Enregistrer</button></div></div>

const KEY="fnafCollectorV2";
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{owned:[],wishlist:[],details:{}};
const $=s=>document.querySelector(s), has=(a,id)=>a.includes(id);
function saveState(){localStorage.setItem(KEY,JSON.stringify(state))}
function imgFail(img){img.parentElement.classList.add('bad')}
function render(){
 let arr=ITEMS.slice(), q=$("#search").value.trim().toLowerCase(), cat=document.querySelector(".tab.active").dataset.cat, f=document.querySelector(".filter.active").dataset.filter, s=$("#sort").value;
 if(cat!=="all")arr=arr.filter(x=>x.category===cat);
 if(q)arr=arr.filter(x=>(x.name+" "+x.wave+" "+x.category).toLowerCase().includes(q));
 if(f==="owned")arr=arr.filter(x=>has(state.owned,x.id));
 else if(f==="wishlist")arr=arr.filter(x=>has(state.wishlist,x.id));
 else if(f==="missing")arr=arr.filter(x=>!has(state.owned,x.id));
 if(s==="az")arr.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
 if(s==="za")arr.sort((a,b)=>b.name.localeCompare(a.name,'fr'));
 $("#grid").innerHTML=arr.map(x=>card(x)).join("");
 $("#empty").style.display=arr.length?"none":"block";
 document.querySelectorAll(".own").forEach(b=>b.onclick=()=>toggleOwned(+b.dataset.id));
 document.querySelectorAll(".heart").forEach(b=>b.onclick=()=>toggleWish(+b.dataset.id));
 document.querySelectorAll(".info").forEach(b=>b.onclick=()=>openModal(+b.dataset.id));
 updateStats();
}
function card(x){
 const owned=has(state.owned,x.id), wish=has(state.wishlist,x.id);
 return `<article class="card ${owned?'owned':''}">
 <div class="pic"><img src="${x.img}" alt="${esc(x.name)}" loading="lazy" onerror="imgFail(this)"><div class="fallback">IMAGE<br>FIGUREREALM</div><div class="mark">${esc(x.wave)}</div><button class="heart ${wish?'on':''}" data-id="${x.id}">${wish?'♥':'♡'}</button></div>
 <div class="body"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.category)}</div><div class="actions"><button class="own ${owned?'on':''}" data-id="${x.id}">${owned?'✓ Possédée':'＋ Posséder'}</button><button class="info" data-id="${x.id}">•••</button></div></div></article>`
}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toggleOwned(id){let i=state.owned.indexOf(id);i<0?state.owned.push(id):state.owned.splice(i,1);saveState();render()}
function toggleWish(id){let i=state.wishlist.indexOf(id);i<0?state.wishlist.push(id):state.wishlist.splice(i,1);saveState();render()}
function updateStats(){let o=state.owned.length;$("#ownedN").textContent=o;$("#missingN").textContent=ITEMS.length-o;$("#wishN").textContent=state.wishlist.length;$("#countBadge").textContent=o+" / "+ITEMS.length;$("#bar").style.width=(o/ITEMS.length*100)+"%"}
let current=0;
function openModal(id){current=id;let x=ITEMS.find(a=>a.id===id),d=state.details[id]||{};$("#mTitle").textContent=x.name;$("#mImg").src=x.img;$("#mImg").onerror=()=>{$("#mImg").style.display="none"};$("#mLink").href=x.url;$("#price").value=d.price||"";$("#value").value=d.value||"";$("#qty").value=d.qty||1;$("#condition").value=d.condition||"";$("#notes").value=d.notes||"";$("#modal").classList.add("show")}
$("#close").onclick=()=>$("#modal").classList.remove("show");$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("show")}
$("#save").onclick=()=>{state.details[current]={price:$("#price").value,value:$("#value").value,qty:$("#qty").value,condition:$("#condition").value,notes:$("#notes").value};saveState();$("#modal").classList.remove("show")}
$("#search").oninput=render;$("#sort").onchange=render;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
$("#export").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fnaf-collector-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("#importBtn").onclick=()=>$("#file").click();$("#file").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);saveState();render()}catch(_){alert("Fichier JSON invalide.")}};r.readAsText(f)}
$("#reset").onclick=()=>{if(confirm("Réinitialiser la collection, wishlist et détails ?")){state={owned:[],wishlist:[],details:{}};saveState();render()}}
render();
</script>
</body>
</html>
