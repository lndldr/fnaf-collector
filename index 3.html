<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070a"><title>FNAF Collector — Jazwares</title>
<style>
:root{--bg:#05070a;--p:#0e131a;--p2:#151c25;--line:#293440;--txt:#f3f5f7;--muted:#89939f;--red:#e51c2a;--green:#38d58e;--gold:#ffd166;--blue:#72adff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#27313c,#080b10 42%,#040507);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:1250px;margin:auto;padding:12px}header{border:1px solid #36414d;border-radius:22px;padding:24px;background:linear-gradient(145deg,#151c25,#080b10);box-shadow:0 25px 80px #0009}.eyebrow{font-size:10px;letter-spacing:3px;color:#a7b0ba;font-weight:900}h1{font-size:clamp(34px,7vw,64px);line-height:.9;letter-spacing:-4px;margin:7px 0;text-transform:uppercase}h1 span{color:var(--red)}header p{color:var(--muted);margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.stat{background:#070a0e;border:1px solid var(--line);border-radius:12px;padding:11px}.stat b{font-size:20px;display:block}.stat small{color:var(--muted)}.bar{height:12px;background:#252c35;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b90f1d,var(--red),#ff665e);transition:.25s}
.toolbar{position:sticky;top:5px;z-index:5;margin:14px 0;padding:9px;background:#080b0eee;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;display:flex;gap:7px;flex-wrap:wrap}input.search{flex:1;min-width:220px;background:#11161d;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:#fff;outline:0}button,.link{border:1px solid var(--line);background:#11161d;color:#e5e9ee;padding:10px 12px;border-radius:9px;font-weight:800;cursor:pointer;text-decoration:none;font-size:12px}button:hover,.link:hover{background:#1a222c}button.active{background:var(--red);border-color:var(--red)}.gold{color:var(--gold)}.danger{color:#ff7f89}
.section{margin:22px 0 9px;color:#b5bec8;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:900}.section span{color:#66727e}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.card{background:linear-gradient(145deg,#121821,#0b0f14);border:1px solid var(--line);border-radius:16px;overflow:hidden}.card.owned{border-color:#216b4c}.card.wish{border-color:#71581b}.visual{height:85px;background:radial-gradient(circle,#303a46,#090c11 70%);display:flex;align-items:center;justify-content:center;color:var(--red);font-size:34px;font-weight:1000;position:relative}.visual small{position:absolute;right:8px;top:7px;color:#7b8794;font-size:9px}.body{padding:12px}.series{font-size:9px;color:#89939f;letter-spacing:1.5px;text-transform:uppercase;font-weight:900}.name{font-size:16px;line-height:1.18;font-weight:900;margin:7px 0;min-height:38px}.tags{min-height:23px;display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:9px;padding:4px 6px;border-radius:6px;background:#1b222b;color:#9ba5b0}.tag.o{background:#10472f;color:#75e5ae}.tag.w{background:#4d3b0d;color:#ffd66b}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}.actions button,.actions a{font-size:10px;padding:9px;text-align:center}.own{color:#73e4ad}.wish{color:#ffd66b}.info{color:var(--blue)}.empty{border:1px dashed var(--line);border-radius:14px;padding:45px;text-align:center;color:var(--muted)}footer{text-align:center;color:#68737e;font-size:10px;padding:25px 0}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:20;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0d1219;border:1px solid #3a4652;border-radius:18px;padding:18px}.box h2{margin:5px 0}.close{float:right}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.field{background:#111720;border:1px solid var(--line);border-radius:9px;padding:9px}.field label{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:900;display:block;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;background:transparent;color:#fff;border:0;outline:0;font:inherit}.field textarea{min-height:85px;resize:vertical}.wide{grid-column:1/-1}.modal-actions{display:flex;gap:7px;margin-top:10px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:1/-1}.fields{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body><div class="app">
<header><div class="eyebrow">FIVE NIGHTS AT FREDDY'S • JAZWARES • COLLECTOR</div>
<h1>MY <span>FNAF</span><br>COLLECTION</h1><p>32 références • Collection • Wishlist • Valeur • Notes</p>
<div class="stats"><div class="stat"><b id="owned">0</b><small>Possédées</small></div><div class="stat"><b id="wishlist">0</b><small>Wishlist</small></div><div class="stat"><b id="missing">32</b><small>À trouver</small></div><div class="stat"><b id="percent">0%</b><small>Complétion</small></div><div class="stat"><b id="spent">0 €</b><small>Dépensé</small></div></div>
<div class="bar"><i id="progress"></i></div></header>
<div class="toolbar"><input id="search" class="search" placeholder="🔎 Rechercher...">
<button class="filter active" data-f="all">Toutes</button><button class="filter" data-f="owned">✓ Collection</button><button class="filter" data-f="wish">★ Wishlist</button><button class="filter" data-f="missing">À trouver</button>
<button id="sort">A → Z</button><button id="export" class="gold">💾 Export</button><button id="import" class="gold">📥 Import</button><button id="reset" class="danger">Reset</button><input id="file" type="file" accept=".json" hidden></div>
<main id="list"></main><footer>Source : FigureRealm — Five Nights at Freddy's (Jazwares) Checklist</footer></div>
<div id="modal" class="modal"><div class="box"><button id="close" class="close">✕</button><div id="mseries" class="series"></div><h2 id="mname"></h2>
<div class="fields"><div class="field"><label>Prix payé (€)</label><input id="price" type="number" step=".01"></div><div class="field"><label>Valeur estimée (€)</label><input id="value" type="number" step=".01"></div>
<div class="field"><label>État</label><select id="condition"><option value="">Non renseigné</option><option>Neuf / scellée</option><option>Comme neuve</option><option>Très bon état</option><option>Bon état</option><option>Loose</option></select></div>
<div class="field"><label>Quantité</label><input id="qty" type="number" min="1" value="1"></div><div class="field wide"><label>Notes</label><textarea id="notes"></textarea></div></div>
<div class="modal-actions"><button id="save" class="active">Enregistrer</button><button id="sale" class="danger">À vendre</button></div></div></div>
<script>
(function(){
const ITEMS=[{"id": 1, "name": "Bidybab & Minireena with Primary Control Module", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=bidybabminireenawithprimarycontrolmodule&id=197048"}, {"id": 2, "name": "Bonnie & Shadow Bonnie (Vault Edition)", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=bonnieshadowbonnievaultedition&id=172706"}, {"id": 3, "name": "Chica with Office", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=chicawithoffice&id=172708"}, {"id": 4, "name": "Circus Baby", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=circusbaby&id=197053"}, {"id": 5, "name": "Ennard", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=ennard&id=197049"}, {"id": 6, "name": "Foxy with Office", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=foxywithoffice&id=172707"}, {"id": 7, "name": "Funtime Foxy", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=funtimefoxy&id=197050"}, {"id": 8, "name": "Funtime Freddy", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=funtimefreddy&id=197054"}, {"id": 9, "name": "Golden Freddy with Office", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=goldenfreddywithoffice&id=172709"}, {"id": 10, "name": "Lolbit with Primary Control Module", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=lolbitwithprimarycontrolmodule&id=197912"}, {"id": 11, "name": "Magician Mangle", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=magicianmangle&id=172719"}, {"id": 12, "name": "Mangle", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=mangle&id=172712"}, {"id": 13, "name": "Puppet with Office", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=puppetwithoffice&id=197043"}, {"id": 14, "name": "Ringmaster Foxy", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=ringmasterfoxy&id=172718"}, {"id": 15, "name": "Shadow Freddy, Toy Chica, RWQFSFASXC, & JJ", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=shadowfreddytoychicarwqfsfasxcjj&id=197046"}, {"id": 16, "name": "Toy Bonnie", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=toybonnie&id=172711"}, {"id": 17, "name": "Toy Chica", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=toychica&id=172710"}, {"id": 18, "name": "Toy Freddie, Toy Bonnie, Toy Chica & Mangle", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=toyfreddietoybonnietoychicamangle&id=172720"}, {"id": 19, "name": "Toy Freddy", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=toyfreddy&id=172705"}, {"id": 20, "name": "Withered Bonnie with Office", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=witheredbonniewithoffice&id=197913"}, {"id": 21, "name": "Withered Chica with Office", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=witheredchicawithoffice&id=197044"}, {"id": 22, "name": "Withered Freddy", "series": "Basic Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=witheredfreddy&id=197914"}, {"id": 23, "name": "Classic Bonnie and Withered Bonnie", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=classicbonnieandwitheredbonnie&id=172717"}, {"id": 24, "name": "Classic Chica and Withered Chica", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=classicchicaandwitheredchica&id=172714"}, {"id": 25, "name": "Classic Foxy and Withered Foxy", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=classicfoxyandwitheredfoxy&id=172713"}, {"id": 26, "name": "Classic Freddy and Shadow Freddy", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=classicfreddyandshadowfreddy&id=172715"}, {"id": 27, "name": "Classic Freddy and Withered Freddy", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=classicfreddyandwitheredfreddy&id=172716"}, {"id": 28, "name": "Glamrock Chica & Shattered Glamrock Chica", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=glamrockchicashatteredglamrockchica&id=197051"}, {"id": 29, "name": "Glamrock Freddy & Shattered Glamrock Freddy", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=glamrockfreddyshatteredglamrockfreddy&id=197045"}, {"id": 30, "name": "Montgomery Gator & Shattered Montgomery Gator", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=montgomerygatorshatteredmontgomerygator&id=197047"}, {"id": 31, "name": "Parts and Service Pack #1", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=partsandservicepack1&id=196196"}, {"id": 32, "name": "Withered Freddy & Golden Freddy", "series": "Endo Series", "url": "https://www.figurerealm.com/actionfigure?action=actionfigure&figure=witheredfreddygoldenfreddy&id=197052"}]; const KEY="fnaf-collector-final"; let state={},filter="all",query="",asc=true,current=null;
const $=id=>document.getElementById(id);
function load(){try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){state={}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function get(id){return state[id]||{}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(n){let a=n.replace(/&.*$/,"").trim().split(/\s+/);return (a[0]?.[0]||"F")+(a[1]?.[0]||"N")}
function toggle(id,type){let r=get(id);if(r.status===type)delete r.status;else r.status=type;state[id]=r;save();render()}
function render(){
let owned=ITEMS.filter(x=>get(x.id).status==="owned").length,wish=ITEMS.filter(x=>get(x.id).status==="wish").length,spent=0;
ITEMS.forEach(x=>{let r=get(x.id);if(r.status==="owned")spent+=(+r.price||0)*(+r.qty||1)});
$("owned").textContent=owned;$("wishlist").textContent=wish;$("missing").textContent=ITEMS.length-owned;$("percent").textContent=Math.round(owned/ITEMS.length*100)+"%";$("spent").textContent=spent.toFixed(2).replace(".",",")+" €";$("progress").style.width=owned/ITEMS.length*100+"%";
let a=ITEMS.filter(x=>{let s=get(x.id).status,t=(x.name+" "+x.series).toLowerCase();return(!query||t.includes(query.toLowerCase()))&&(filter==="all"||(filter==="owned"&&s==="owned")||(filter==="wish"&&s==="wish")||(filter==="missing"&&s!=="owned"))});
a.sort((x,y)=>asc?x.name.localeCompare(y.name):y.name.localeCompare(x.name));
let h="";["Basic Series","Endo Series"].forEach(series=>{let g=a.filter(x=>x.series===series);if(!g.length)return;h+=`<div class="section">${esc(series)} <span>• ${g.length}</span></div><div class="grid">`;g.forEach(x=>{let r=get(x.id),s=r.status;h+=`<article class="card ${s||""}"><div class="visual"><b>${esc(initials(x.name))}</b><small>#${x.id}</small></div><div class="body"><div class="series">${esc(x.series)} • Jazwares</div><div class="name">${esc(x.name)}</div><div class="tags">${s==="owned"?'<span class="tag o">✓ POSSÉDÉE</span>':s==="wish"?'<span class="tag w">★ WISHLIST</span>':""}${r.condition?`<span class="tag">${esc(r.condition)}</span>`:""}${r.price?`<span class="tag">${(+r.price).toFixed(2)} €</span>`:""}${r.forSale?'<span class="tag">À VENDRE</span>':""}</div><div class="actions"><button class="own" data-act="owned" data-id="${x.id}">${s==="owned"?"✓ Possédée":"＋ Collection"}</button><button class="wish" data-act="wish" data-id="${x.id}">${s==="wish"?"★ Wishlist":"☆ Wishlist"}</button><a class="info link" href="${x.url}" target="_blank" rel="noopener">Fiche ↗</a></div></div></article>`});h+="</div>"});
$("list").innerHTML=h||'<div class="empty">Aucun résultat.</div>';
}
document.addEventListener("click",e=>{let b=e.target.closest("[data-act]");if(b){toggle(+b.dataset.id,b.dataset.act);return}let f=e.target.closest(".filter");if(f){document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));f.classList.add("active");filter=f.dataset.f;render()}});
$("search").addEventListener("input",e=>{query=e.target.value;render()});
$("sort").addEventListener("click",function(){asc=!asc;this.textContent=asc?"A → Z":"Z → A";render()});
$("reset").addEventListener("click",()=>{if(confirm("Effacer toute la collection ?")){state={};save();render()}});
$("export").addEventListener("click",()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="fnaf-collection.json";a.click();URL.revokeObjectURL(u)});
$("import").addEventListener("click",()=>$("file").click());$("file").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert("Sauvegarde importée.")}catch{alert("Fichier invalide.")}};r.readAsText(f)});
document.addEventListener("click",e=>{let card=e.target.closest(".card");if(!card||e.target.closest("button,a"))return});
$("close").addEventListener("click",()=>$("modal").classList.remove("show"));
load();render();
})();
</script></body></html>
