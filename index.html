<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><title>FNAF Jazwares Checklist</title><style>
:root{color-scheme:dark;--bg:#0b0b0d;--card:#1c1c20;--line:#34343a;--muted:#a3a3aa;--text:#f5f5f7;--accent:#ef4444;--ok:#22c55e}

main{max-width:1100px;margin:auto;padding:18px 14px 50px}header{padding:18px 4px 12px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#aaa}h1{font-size:30px;margin:4px 0 3px}.subtitle{color:var(--muted);font-size:14px}

</style></head><body><main><header><div class="eyebrow">Jazwares • Five Nights at Freddy's</div><h1>Checklist FNAF</h1><div class="subtitle">World of FNAF + Endo-Series</div></header><section class="hero"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:17px">Ma collection</b><div class="muted">Coche les références que tu possèdes.</div></div><div id="pct">0%</div></div><div class="progress"><div id="bar"></div></div><div class="stats"><div class="stat"><b id="owned">0</b><span class="muted">possédées</span></div><div class="stat"><b id="missing">43</b><span class="muted">à trouver</span></div><div class="stat"><b>43</b><span class="muted">références</span></div></div></section><div class="controls"><input id="search" type="search" placeholder="🔎 Rechercher une figurine…"><select id="filter"><option value="all">Toutes</option><option value="missing">À trouver</option><option value="owned">Possédées</option></select><button id="reset" type="button">Réinitialiser</button></div><div class="tabs"><button class="tab active" data-section="all" type="button">Toutes (43)</button><button class="tab" data-section="World of FNAF" type="button">World of FNAF (26)</button><button class="tab" data-section="Endo-Series" type="button">Endo-Series (17)</button></div><div id="list"></div><section class="reference"><div class="section-title"><h2>Checklist originale</h2><span class="count">Image de référence</span></div><img src="images/checklist-originale.jpg" alt="Checklist originale FNAF Jazwares"></section></main><script>const ITEMS=[{"id": "world-1", "name": "Toy Freddy", "tag": "Wave 1", "section": "World of FNAF", "img": "images/1.jpg"}, {"id": "world-2", "name": "Toy Bonnie", "tag": "Wave 1", "section": "World of FNAF", "img": "images/2.jpg"}, {"id": "world-3", "name": "Toy Chica", "tag": "Wave 1", "section": "World of FNAF", "img": "images/3.jpg"}, {"id": "world-4", "name": "Mangle", "tag": "Wave 1", "section": "World of FNAF" tion": "Endo-Series", "img": "images/38.jpg"}, {"id": "endo-13", "name": "Classic Freddy + Shadow Freddy", "tag": "Vault", "section": "Endo-Series", "img": "images/39.jpg"}, {"id": "endo-14", "name": "Classic Bonnie + Shadow Bonnie", "tag": "Vault", "section": "Endo-Series", "img": "images/40.jpg"}, {"id": "endo-15", "name": "Classic Foxy + Radioactive Foxy", "tag": "Vault", "section": "Endo-Series", "img": "images/41.jpg"}, {"id": "endo-16", "name": "Endo-01 Set", "tag": "Parts & Service", "section": "Endo-Series", "img": "images/42.jpg"}, {"id": "endo-17", "name": "Endo-02 Set", "tag": "Parts & Service", "section": "Endo-Series", "img": "images/43.jpg"}];let owned=new Set();let section='all';const list=document.getElementById('list'),search=document.getElementById('search'),filter=document.getElementById('filter');function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function stats(){let n=owned.size,p=Math.round(n/ITEMS.length*100);document.getElementById('owned').textContent=n;document.getElementById('missing').textContent=ITEMS.length-n;document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%'}function render(){let q=search.value.toLowerCase().trim(),f=filter.value;let a=ITEMS.filter(x=>(section==='all'||x.section===section)&&(!q||(x.name+' '+x.tag+' '+x.section).toLowerCase().includes(q))&&(f==='all'||(f==='owned'?owned.has(x.id):!owned.has(x.id))));list.innerHTML='';if(!a.length){list.innerHTML='<div class="empty">Aucune référence.</div>';stats();return} [...new Set(a.map(x=>x.section))].forEach(sec=>{let arr=a.filter(x=>x.section===sec),all=ITEMS.filter(x=>x.section===sec),done=all.filter(x=>owned.has(x.id)).length;let t=document.createElement('div');t.className='section-title';t.innerHTML='<h2>'+sec+'</h2><span class="count">'+done+'/'+all.length+' possédées</span>';list.appendChild(t);let g=document.createElement('div');g.className='grid';arr.forEach(x=>{let c=document.createElement('article');c.className='card'+(owned.has(x.id)?' owned':'');c.innerHTML='<div class="thumb"><img src="'+x.img+'" alt="'+esc(x.name)+'"></div><div class="info"><div class="name">'+esc(x.name)+'</div><div class="tag">'+esc(x.tag)+'</div></div><button class="check" type="button" aria-label="Cocher"></button>';c.querySelector('.check').addEventListener('click',()=>{owned.has(x.id)?owned.delete(x.id):owned.add(x.id);render()});g.appendChild(c)});list.appendChild(g)});stats()}search.addEventListener('input',render);filter.addEventListener('change',render);document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');section=b.dataset.section;render()}));document.getElementById('reset').addEventListener('click',()=>{owned.clear();render()});render();</script></body></html>
